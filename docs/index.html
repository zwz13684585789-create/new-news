<body><main><div class="k">DAILY BRIEF · SETUP</div><h1>全球要闻简报</h1>
<p>这个仓库还没有生成第一期。到 <b>Actions → Daily Brief → Run workflow</b> 手动运行一次；之后每天北京时间 08:00 自动更新。</p>
<div class="note">第一次运行前，请按 README 配置 <code>MAIL_TO</code>、<code>SMTP_USER</code>、<code>SMTP_PASS</code>（或 <code>RESEND_API_KEY</code>），并在 Settings → Pages 里把 Source 设为 <b>GitHub Actions</b>。</div>
<p>本地预览：<code>python scripts/build_brief.py --sample --no-llm --no-email</code></p>
